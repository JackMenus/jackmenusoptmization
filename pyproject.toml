[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optiforge"
version = "0.1.0"
description = "Modular optimisation platform with an autonomous operator/algorithm development layer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "PyYAML>=6.0,<7",
  "click>=8.1,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic"]

[project.scripts]
optiforge = "optiforge.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: longer integration runs",
  "sandbox: requires Linux namespace isolation",
  "integration: end-to-end development-loop runs",
]
