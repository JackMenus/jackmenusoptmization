# Runs the test suite on every push and pull request. The sandbox tests need unprivileged user namespaces, which
# GitHub's Ubuntu runners provide; OPTIFORGE_REQUIRE_ISOLATION makes them fail instead of skip if that changes.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The sandbox exposes the interpreter read-only and requires it under /usr, so use a system Python 3.13
      # (deadsnakes) instead of actions/setup-python, which installs under /opt/hostedtoolcache.
      - name: Install Python 3.13 under /usr
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.13 python3.13-venv
          python3.13 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 restricts them through AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e .
      - name: Test
        env:
          OPTIFORGE_REQUIRE_ISOLATION: "1"
        run: python -m pytest -q -p no:cacheprovider
